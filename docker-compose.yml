version: '3.8'

services:
  # Backend API Server
  backend:
    build: ./backend
    container_name: pizza-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - KITCHEN_PASSWORD=admin123
    volumes:
      # Persistiere Daten (Bestellungen, Ausverkauft-Status)
      - ./backend/data:/app/data
    networks:
      - pizza-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend Nginx Server
  frontend:
    build: ./frontend
    container_name: pizza-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - pizza-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  pizza-network:
    driver: bridge

volumes:
  pizza-data:
